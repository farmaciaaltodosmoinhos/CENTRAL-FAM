<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Admin · Central Operacional</title>
<link rel="stylesheet" href="../assets/module-chrome.css">
<style>
  :root{
    --ink:#1c2521; --ink-soft:#4a5650; --paper:#f6f5f0; --panel:#ffffff;
    --line:#dcdcd2; --brand:#2b7a4b; --brand-deep:#1f543e; --brand-soft:#e3f2e8;
    --bad:#a4342a; --bad-bg:#fbebe8; --bad-line:#eec3bc;
    --mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
    --sans: "Inter", "Helvetica Neue", Arial, sans-serif;
    --radius: 10px;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{ background:var(--paper); color:var(--ink); font-family:var(--sans); min-height:100vh; -webkit-font-smoothing:antialiased; }
  .wrap{ max-width:1000px; margin:0 auto; padding:28px 20px 100px; }
  header.top{ display:flex; align-items:center; justify-content:space-between; gap:16px; padding-bottom:18px; border-bottom:2px solid var(--ink); margin-bottom:22px; flex-wrap:wrap; }
  h1{ font-size:22px; margin:0; font-weight:700; }
  h1 small{ display:block; font-weight:500; font-size:12px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; margin-top:4px; }
  .contagem{ font-family:var(--mono); font-size:13px; color:var(--ink-soft); }
  .contagem b{ color:var(--ink); font-size:18px; }
  table{ width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; }
  th, td{ text-align:left; padding:10px 14px; border-bottom:1px solid var(--line); font-size:13.5px; }
  th{ background:var(--brand-soft); color:var(--brand-deep); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.03em; }
  tr:last-child td{ border-bottom:none; }
  .tid{ font-family:var(--mono); font-size:11.5px; color:var(--ink-soft); }
  .estado{ padding:32px; text-align:center; color:var(--ink-soft); }
  .estado.erro{ color:var(--bad); background:var(--bad-bg); border:1px solid var(--bad-line); border-radius:var(--radius); }
  .module-back{ display:inline-flex; align-items:center; gap:6px; background:var(--brand-soft); border:1px solid var(--brand); border-radius:999px; padding:6px 14px; font-size:13px; color:var(--brand-deep); text-decoration:none; }
  .module-back:hover{ background:#d8ecdf; }
</style>
</head>
<body>

<div class="mc-standalone-bar" id="mcStandaloneBar"><a href="/">← Voltar à Central Operacional</a></div>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Painel Developer / Super-Admin<small>Ponto 54 — visão de todas as farmácias registadas</small></h1>
    </div>
    <div style="display:flex; align-items:center; gap:14px;">
      <div class="contagem" id="contagem"></div>
      <a class="module-back" href="/">← Voltar à Central</a>
    </div>
  </header>

  <div id="conteudo"><div class="estado">A carregar…</div></div>
</div>

<script src="../assets/module-chrome.js"></script>
<script type="module">
import { getToken, isAutenticado } from "../src/authClient.js";
import { escapeHtml } from "../src/utils.js";

const conteudoEl = document.getElementById("conteudo");
const contagemEl = document.getElementById("contagem");

function formatarData(iso) {
  if (!iso) return "—";
  try {
    const d = new Date(iso);
    return d.toLocaleDateString("pt-PT", { year: "numeric", month: "2-digit", day: "2-digit" }) +
      " " + d.toLocaleTimeString("pt-PT", { hour: "2-digit", minute: "2-digit" });
  } catch { return iso; }
}

async function carregar() {
  if (!isAutenticado()) {
    conteudoEl.innerHTML = `<div class="estado erro">Sem sessão iniciada. <a href="/">Entre na Central</a> primeiro.</div>`;
    return;
  }
  try {
    const res = await fetch("/api/auth/admin-farmacias", {
      headers: { authorization: `Bearer ${getToken()}` }
    });
    if (res.status === 401) {
      conteudoEl.innerHTML = `<div class="estado erro">Sessão expirada. <a href="/">Entre novamente</a>.</div>`;
      return;
    }
    if (res.status === 403) {
      conteudoEl.innerHTML = `<div class="estado erro">Esta conta não tem permissões de administração. Se acha que deveria ter, confirme que o seu email está em <code>SUPER_ADMIN_EMAILS</code> nas variáveis de ambiente do Netlify.</div>`;
      return;
    }
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      conteudoEl.innerHTML = `<div class="estado erro">Falha ao carregar a lista de farmácias${err.error ? ": " + escapeHtml(err.error) : "."}</div>`;
      return;
    }
    const { farmacias } = await res.json();
    contagemEl.innerHTML = `<b>${farmacias.length}</b> farmácia${farmacias.length === 1 ? "" : "s"} registada${farmacias.length === 1 ? "" : "s"}`;
    if (farmacias.length === 0) {
      conteudoEl.innerHTML = `<div class="estado">Ainda não há nenhuma farmácia registada.</div>`;
      return;
    }
    conteudoEl.innerHTML = `
      <table>
        <thead><tr><th>Farmácia</th><th>Email</th><th>Criado em</th><th>Tenant ID</th></tr></thead>
        <tbody>
          ${farmacias.map(f => `
            <tr>
              <td>${escapeHtml(f.nomeFarmacia || "—")}</td>
              <td>${escapeHtml(f.email || "—")}</td>
              <td>${escapeHtml(formatarData(f.criadoEm))}</td>
              <td class="tid">${escapeHtml(f.tenantId || "—")}</td>
            </tr>`).join("")}
        </tbody>
      </table>
      <p style="font-size:12px;color:var(--ink-soft);margin-top:16px;">
        Só leitura, por agora — ver ponto 54 em arquitetura-decisoes.md para o que fica para uma próxima ronda
        (ferramentas de manutenção, monitor de erros, gestão de atualizações).
      </p>`;
  } catch (err) {
    conteudoEl.innerHTML = `<div class="estado erro">Não foi possível contactar o servidor (sem ligação à internet?).</div>`;
  }
}

carregar();
</script>
</body>
</html>
